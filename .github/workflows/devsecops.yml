name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prinsip least privilege: workflow hanya boleh membaca isi repository.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------
  # JOB 1: BUILD - install dependency + unit test + coverage gate
  # ---------------------------------------------------------------
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage (Quality Gate - coverage minimal 80%)
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  # ---------------------------------------------------------------
  # JOB 2: SAST - analisis statis dengan Bandit + Quality Gate
  # ---------------------------------------------------------------
  sast-scan:
    name: SAST Scan (Bandit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Generate Bandit reports (semua temuan, tidak menggagalkan job)
        run: |
          bandit -r app -f json -o bandit-report.json || true
          bandit -r app -f txt -o bandit-report.txt || true
          echo "### Hasil Bandit SAST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 25 bandit-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: |
            bandit-report.json
            bandit-report.txt

      - name: Quality Gate - gagal jika ada temuan severity MEDIUM atau HIGH
        run: |
          bandit -r app --severity-level medium
